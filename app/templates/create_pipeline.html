{% extends "layout.html" %}

{% block content %}

<div class="container">

<div class="card shadow p-4">

<h2>Add Pipeline</h2>

<form method="POST">

<div class="mb-3">

<label>Project</label>

<select
name="project_id"
class="form-control"
required>

{% for project in projects %}

<option value="{{ project.id }}">

{{ project.project_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Pipeline Name</label>

<input
type="text"
name="pipeline_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Version</label>

<input
type="text"
name="version"
class="form-control">

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
class="form-control"></textarea>

</div>

<button class="btn btn-primary">

Save Pipeline

</button>

<a
href="/pipelines"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

{% endblock %}
