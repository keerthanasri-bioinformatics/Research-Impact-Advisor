{% extends "layout.html" %}

{% block content %}

<div class="container">

<div class="card shadow p-4">

<h2 class="mb-4">Add Reference Database</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">Pipeline</label>

<select class="form-control" name="pipeline_id" required>

{% for pipeline in pipelines %}

<option value="{{ pipeline.id }}">

{{ pipeline.pipeline_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">Database Name</label>

<input
type="text"
name="database_name"
class="form-control"
placeholder="Example: ClinVar"
required>

</div>

<div class="mb-3">

<label class="form-label">Version</label>

<input
type="text"
name="version"
class="form-control"
placeholder="Example: 2025.01"
required>

</div>

<div class="mb-3">

<label class="form-label">Release Date</label>

<input
type="date"
name="release_date"
class="form-control">

</div>

<button class="btn btn-primary">

Save Database

</button>

<a href="/databases"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

{% endblock %}
