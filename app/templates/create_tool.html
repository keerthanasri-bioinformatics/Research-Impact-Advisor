{% extends "layout.html" %}

{% block content %}

<div class="container">

<div class="card shadow p-4">

<h2 class="mb-4">Add Bioinformatics Tool</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">Pipeline</label>

<select
class="form-control"
name="pipeline_id"
required>

{% for pipeline in pipelines %}

<option value="{{ pipeline.id }}">

{{ pipeline.pipeline_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">Tool Name</label>

<input
type="text"
name="tool_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Version</label>

<input
type="text"
name="version"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Purpose</label>

<input
type="text"
name="purpose"
class="form-control">

</div>

<button class="btn btn-primary">

Save Tool

</button>

<a href="/tools"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

{% endblock %}
